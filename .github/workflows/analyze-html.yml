name: Obscura Website Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: Website URL to inspect
        required: true
        type: string

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Obscura
        run: |
          curl -fL --retry 3 https://github.com/h4ckf0r0day/obscura/releases/latest/download/obscura-x86_64-linux.tar.gz -o obscura.tar.gz
          tar -xzf obscura.tar.gz
          chmod +x ./obscura
          ./obscura --help

      - name: Run Obscura capture and analysis
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          mkdir -p analysis
          URL="$TARGET_URL"
          if [[ ! "$URL" =~ ^https?:// ]]; then echo "Invalid URL"; exit 1; fi
          ./obscura fetch "$URL" --wait-until networkidle0 --timeout 60 --dump html --output analysis/rendered.html
          ./obscura fetch "$URL" --wait-until networkidle0 --timeout 60 --dump text --output analysis/page-text.txt
          ./obscura fetch "$URL" --wait-until networkidle0 --timeout 60 --dump links --output analysis/links.txt
          ./obscura fetch "$URL" --wait-until networkidle0 --timeout 60 --dump assets --output analysis/assets.ndjson
          ./obscura fetch "$URL" --wait-until networkidle0 --timeout 60 --eval "JSON.stringify({title:document.title,url:location.href,text:(document.body?.innerText||'').slice(0,30000),links:[...document.querySelectorAll('a')].slice(0,500).map(a=>({text:(a.innerText||'').trim().slice(0,160),href:a.href})),images:[...document.querySelectorAll('img')].slice(0,500).map(i=>({src:i.src,alt:i.alt,className:i.className})),videos:[...document.querySelectorAll('video,source,iframe')].slice(0,250).map(e=>({tag:e.tagName,src:e.src||e.getAttribute('src')||'',className:e.className||''})),scripts:[...document.scripts].map(s=>s.src||'inline').slice(0,200)})" --output analysis/dom-report.json
          ./obscura fetch "$URL" --wait-until networkidle0 --timeout 60 --screenshot analysis/page.png || echo "Screenshot unavailable; continuing."
          python - <<'PY'
          import json, os, hashlib, datetime
          p='analysis/rendered.html'
          raw=open(p,'rb').read() if os.path.exists(p) else b''
          summary={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'engine':'Obscura only (no Playwright/Chromium)','html_bytes':len(raw),'html_sha256':hashlib.sha256(raw).hexdigest() if raw else None,'files':sorted(os.listdir('analysis'))}
          with open('analysis/summary.json','w') as f: json.dump(summary,f,indent=2)
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload Obscura analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: begg-obscura-analysis
          path: analysis/
          retention-days: 7

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/page-text.txt analysis/links.txt analysis/assets.ndjson analysis/dom-report.json analysis/summary.json
          if git diff --cached --quiet; then
            echo "Reports unchanged."
          else
            git commit -m "Update Obscura website analysis"
            git push
          fi
