name: Website HTML Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL to inspect
        required: true
        type: string

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and inspect HTML
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, json, re, hashlib
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from urllib.parse import urlparse, urljoin, parse_qsl
          from urllib.request import Request, urlopen

          target = os.environ["TARGET_URL"].strip()
          parsed = urlparse(target)
          if parsed.scheme not in ("http", "https") or not parsed.netloc:
              raise SystemExit("Please provide a valid http(s) URL")

          request = Request(target, headers={"User-Agent": "Begg-HTML-Analyzer/1.0"})
          with urlopen(request, timeout=30) as response:
              raw = response.read()
              status = response.status
              content_type = response.headers.get("Content-Type", "")
              final_url = response.geturl()

          html = raw.decode("utf-8", errors="replace")

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = {}
                  self.classes = {}
                  self.images = []
                  self.links = []
                  self.scripts = []
                  self.styles = []
                  self.videos = []
                  self.card_samples = []
                  self.title_parts = []
                  self.in_title = False
                  self.current_link = None

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  self.tags[tag] = self.tags.get(tag, 0) + 1
                  classes = a.get("class", "")
                  for c in classes.split():
                      self.classes[c] = self.classes.get(c, 0) + 1
                  if tag == "title":
                      self.in_title = True
                  if tag == "a":
                      self.current_link = {"href": a.get("href"), "text": ""}
                      self.links.append(self.current_link)
                  if tag == "img":
                      self.images.append({"src":a.get("src"), "alt":a.get("alt",""), "class":classes})
                  if tag == "script":
                      self.scripts.append(a.get("src") or "(inline script)")
                  if tag == "link" and "stylesheet" in (a.get("rel") or "").split():
                      self.styles.append(a.get("href"))
                  if tag == "video":
                      self.videos.append({"class":classes, "has_src":bool(a.get("src")), "attribute_names":sorted(a.keys())})
                  if re.search(r"(tile|card|frame|video)", classes, re.I) and len(self.card_samples) < 50:
                      self.card_samples.append({"tag":tag, "class":classes, "attributes":sorted(a.keys())})

              def handle_endtag(self, tag):
                  if tag == "title":
                      self.in_title = False
                  if tag == "a":
                      self.current_link = None

              def handle_data(self, data):
                  s = data.strip()
                  if not s:
                      return
                  if self.in_title:
                      self.title_parts.append(s)
                  if self.current_link is not None:
                      self.current_link["text"] += (" " + s)

          parser = Parser()
          parser.feed(html)
          base = urlparse(final_url)

          def safe_page_url(value):
              if not value:
                  return None
              u = urlparse(urljoin(final_url, value))
              if u.scheme not in ("http", "https"):
                  return None
              if re.search(r"\.(m3u8|mp4|m4v|ts|webm|mov)(?:$|\?)", u.path, re.I):
                  return None
              sensitive = {"key","token","signature","sig","auth","expires"}
              if any(k.lower() in sensitive for k, _ in parse_qsl(u.query, keep_blank_values=True)):
                  return None
              return u.scheme + "://" + u.netloc + u.path

          page_links = []
          for link in parser.links:
              url = safe_page_url(link["href"])
              if url and urlparse(url).netloc == base.netloc:
                  item = {"url":url, "text":re.sub(r"\s+"," ",link["text"]).strip()[:160]}
                  if item not in page_links:
                      page_links.append(item)

          image_refs = []
          for item in parser.images:
              url = safe_page_url(item["src"])
              if url:
                  image_refs.append({"url":url, "alt":item["alt"][:120], "class":item["class"][:160]})

          report = {
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "page":parsed.scheme + "://" + parsed.netloc + parsed.path,
              "final_page":base.scheme + "://" + base.netloc + base.path,
              "http_status":status,
              "content_type":content_type,
              "html_bytes":len(raw),
              "sha256":hashlib.sha256(raw).hexdigest(),
              "title":" ".join(parser.title_parts),
              "tag_counts":parser.tags,
              "top_classes":sorted(parser.classes.items(), key=lambda x:x[1], reverse=True)[:100],
              "script_sources":parser.scripts[:100],
              "stylesheet_links":parser.styles[:100],
              "image_count":len(parser.images),
              "images":image_refs[:250],
              "same_host_link_count":len(page_links),
              "same_host_links":page_links[:300],
              "video_elements":parser.videos,
              "card_like_samples":parser.card_samples,
              "notes":["This is static HTML analysis. A browser-rendered page may contain additional DOM.",
                        "Signed/tokenized URLs and direct media endpoints are omitted from committed reports."]
          }

          os.makedirs("analysis", exist_ok=True)
          with open("analysis/latest.json","w",encoding="utf-8") as f:
              json.dump(report,f,ensure_ascii=False,indent=2)

          def md_escape(value):
              return str(value).replace("|","\\|").replace("\n"," ")

          lines = [
              "# Website HTML Analysis","",
              f"- Generated: {report['generated_at']}",
              f"- Page: {report['page']}",
              f"- HTTP status: {status}",
              f"- Content type: {content_type}",
              f"- HTML bytes: {len(raw):,}",
              f"- SHA-256: {report['sha256']}",
              f"- Title: {report['title']}",
              f"- Images found: {len(parser.images)}",
              f"- Same-host links: {len(page_links)}",
              f"- Video elements: {len(parser.videos)}","",
              "## Tag counts","",
              "| Tag | Count |","|---|---:|"
          ]
          lines += [f"| `<{tag}>` | {count} |" for tag,count in sorted(parser.tags.items(),key=lambda x:x[1],reverse=True)]
          lines += ["","## Top CSS classes","","| Class | Count |","|---|---:|"]
          lines += [f"| `.{md_escape(name)}` | {count} |" for name,count in report["top_classes"]]
          lines += ["","## Script sources",""] + [f"- {src}" for src in report["script_sources"]]
          lines += ["","## Stylesheets",""] + [f"- {src}" for src in report["stylesheet_links"]]
          lines += ["","## Same-host links (filtered)","","| Link text | URL |","|---|---|"]
          lines += [f"| {md_escape(item['text'])} | {item['url']} |" for item in page_links[:300]]
          lines += ["","## Image references (query strings removed)","","| Alt | URL | Class |","|---|---|---|"]
          lines += [f"| {md_escape(item['alt'])} | {item['url']} | {md_escape(item['class'])} |" for item in image_refs[:250]]
          lines += ["","## Video element attributes summary","","```json",json.dumps(parser.videos,indent=2),"```"]
          lines += ["","## Card-like DOM samples","","```json",json.dumps(parser.card_samples,indent=2),"```"]
          lines += ["","## Notes",""] + [f"- {note}" for note in report["notes"]]
          with open("analysis/latest.md","w",encoding="utf-8") as f:
              f.write("\n".join(lines))
          with open("analysis/raw.html","w",encoding="utf-8") as f:
              f.write(html)
          print(f"Done: {len(raw)} HTML bytes, {len(parser.images)} image elements, {len(page_links)} same-host links")

      - name: Upload raw HTML snapshot
        uses: actions/upload-artifact@v4
        with:
          name: begg-html-snapshot
          path: analysis/raw.html
          retention-days: 7

      - name: Commit analysis reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/latest.json analysis/latest.md
          if git diff --cached --quiet; then
            echo "Report unchanged; nothing to commit."
          else
            git commit -m "Update website HTML analysis"
            git push
          fi
