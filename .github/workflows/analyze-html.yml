name: Browser Website Analysis

on:
  workflow_dispatch:
    inputs:
      url:
        description: Website URL to inspect
        required: true
        type: string

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture browser-rendered page and diagnostics
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          mkdir -p analysis
          cat > capture.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const crypto = require('crypto');

          const target = process.env.TARGET_URL;
          if (!/^https?:\/\//i.test(target)) throw new Error('Please provide an http(s) URL.');

          const safeUrl = (raw) => {
            try {
              const u = new URL(raw);
              return { url: u.origin + u.pathname, queryKeys: [...u.searchParams.keys()] };
            } catch { return { url: String(raw).slice(0, 300), queryKeys: [] }; }
          };

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            const requests = [];
            const failures = [];
            const responses = [];
            page.on('request', req => {
              requests.push({ method: req.method(), resourceType: req.resourceType(), ...safeUrl(req.url()) });
            });
            page.on('requestfailed', req => failures.push({ method: req.method(), resourceType: req.resourceType(), ...safeUrl(req.url()), error: req.failure()?.errorText }));
            page.on('response', res => {
              responses.push({ status: res.status(), resourceType: res.request().resourceType(), ...safeUrl(res.url()), contentType: res.headers()['content-type'] || '' });
            });
            const consoleErrors = [];
            page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text().slice(0, 500)); });
            const pageErrors = [];
            page.on('pageerror', err => pageErrors.push(err.message.slice(0, 500)));

            const nav = await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(12000);
            await page.evaluate(() => window.scrollTo(0, document.body.scrollHeight));
            await page.waitForTimeout(2500);
            const renderedHtml = await page.content();
            const dom = await page.evaluate(() => {
              const title = document.title;
              const text = (document.body?.innerText || '').slice(0, 30000);
              const elements = [...document.querySelectorAll('a, img, video, source, iframe')].map(el => ({
                tag: el.tagName.toLowerCase(),
                text: (el.innerText || el.getAttribute('alt') || '').trim().slice(0, 160),
                class: String(el.className || '').slice(0, 250),
                src: el.getAttribute('src') || '',
                href: el.getAttribute('href') || '',
                attrs: [...el.attributes].map(a => a.name)
              })).slice(0, 1000);
              const classes = {};
              document.querySelectorAll('*').forEach(el => {
                for (const c of el.classList || []) classes[c] = (classes[c] || 0) + 1;
              });
              return { title, text, elements, topClasses: Object.entries(classes).sort((a,b) => b[1]-a[1]).slice(0,150) };
            });

            const report = {
              generatedAt: new Date().toISOString(),
              target: safeUrl(target),
              finalUrl: safeUrl(page.url()),
              status: nav?.status() || null,
              htmlBytes: Buffer.byteLength(renderedHtml),
              htmlSha256: crypto.createHash('sha256').update(renderedHtml).digest('hex'),
              dom,
              requestCount: requests.length,
              responseCount: responses.length,
              requests,
              responses,
              requestFailures: failures,
              consoleErrors,
              pageErrors,
              note: 'Query values are omitted from URL records; query parameter names are retained for diagnostic context.'
            };
            fs.writeFileSync('analysis/browser-report.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('analysis/rendered.html', renderedHtml);
            fs.writeFileSync('analysis/page-text.txt', dom.text);
            fs.writeFileSync('analysis/requests.json', JSON.stringify({ requests, responses, failures }, null, 2));
            console.log('Browser capture finished. HTML bytes:', report.htmlBytes, 'DOM elements:', dom.elements.length, 'requests:', requests.length, 'responses:', responses.length);
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
          node capture.cjs

      - name: Upload browser capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: begg-browser-capture
          path: analysis/
          retention-days: 7

      - name: Commit sanitized report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/browser-report.json analysis/page-text.txt analysis/requests.json
          if git diff --cached --quiet; then
            echo "Report unchanged."
          else
            git commit -m "Update browser website analysis"
            git push
          fi
