name: Website HTML Extractor

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Website URL (http:// or https://)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate URL
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import ipaddress, os, sys
          from urllib.parse import urlparse

          url = os.environ["TARGET_URL"].strip()
          p = urlparse(url)
          if p.scheme not in ("http", "https") or not p.hostname:
              sys.exit("URL must start with http:// or https://")
          host = p.hostname.lower()
          if host in ("localhost", "localhost.localdomain") or host.endswith(".localhost"):
              sys.exit("Localhost URLs are not allowed")
          try:
              ip = ipaddress.ip_address(host)
              if not ip.is_global:
                  sys.exit("Private or reserved IP addresses are not allowed")
          except ValueError:
              pass
          print("URL accepted")
          PY

      - name: Fetch HTML
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          mkdir -p extracted_html
          curl --fail --silent --show-error \
            --max-time 45 --connect-timeout 15 \
            --max-filesize 15000000 \
            --user-agent "Begg-HTML-Extractor/1.0" \
            --output extracted_html/page.html \
            --write-out "HTTP status: %{http_code}\nContent type: %{content_type}\nFinal URL: %{url_effective}\n" \
            "$TARGET_URL" > extracted_html/fetch-info.txt
          {
            echo "Requested URL: $TARGET_URL"
            echo "Fetched at (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            cat extracted_html/fetch-info.txt
          } > extracted_html/metadata.txt

      - name: Commit HTML output to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted_html/
          if git diff --cached --quiet; then
            echo "Output unchanged; no commit created."
          else
            git commit -m "Update extracted HTML output"
            git push
          fi
